<!doctype html><html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delete DEVA Account</title><style>body{max-width:700px;margin:40px auto;padding:0 20px;font-family:system-ui;line-height:1.9;color:#222}</style></head><body><h1>سڕینەوەی هەژماری DEVA</h1><p>لە ئەپی DEVA بچۆ بۆ Profile → Account → Delete Account. دوای پشتڕاستکردنەوە، هەژمار و Favorites و Cart و Push Tokens ـی پەیوەست سڕدرێنەوە.</p><p>ئەگەر نەتوانیت بچیتە ژوورەوە، لە خزمەتگوزاری فەرمی DEVA داوای سڕینەوە بکە. پێش Store release زانیاری پەیوەندی فەرمی لێرە زیاد بکرێت.</p></body></html>
